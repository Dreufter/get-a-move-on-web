<style>
  :root {
    --bg: #131a2a;
    --bg-deep: #0c111d;
    --card: #1b2336;
    --card-border: #2a3450;
    --text: #eef1f7;
    --muted: #9aa5c0;
    --cardboard: #f4d6a8;
    --cardboard-dark: #5a3a1a;
    --orange: #f28c28;
    --orange-hover: #ff9d3d;
    --teal: #2bb3a3;
    --green: #3ecf8e;
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(1200px 600px at 50% -10%, #223052 0%, var(--bg) 55%, var(--bg-deep) 100%) fixed;
    background-color: var(--bg);
    color: var(--text);
    font: 16px/1.6 Rubik, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  a { color: var(--orange); }
  a:focus-visible, button:focus-visible, select:focus-visible { outline: 3px solid var(--teal); outline-offset: 3px; }

  /* Cinta de embalar arriba */
  .tape {
    height: 12px;
    background: repeating-linear-gradient(-45deg, var(--orange) 0 16px, #1d1f24 16px 32px);
  }

  .lang {
    position: absolute; top: 24px; right: 16px;
    display: flex; align-items: center; gap: 8px;
    color: var(--muted); font-size: 14px;
  }
  .lang select {
    background: var(--card); color: var(--text);
    border: 1px solid var(--card-border); border-radius: 10px;
    padding: 6px 10px; font: inherit; cursor: pointer;
  }

  .wrap { max-width: 880px; margin: 0 auto; padding: 56px 16px 40px; }

  .hero { text-align: center; margin-bottom: 32px; }
  .eyebrow {
    margin: 0 0 12px; color: var(--orange);
    font-weight: 700; font-size: 13px; letter-spacing: .18em; text-transform: uppercase;
  }
  .title {
    margin: 0; font: 400 clamp(40px, 9vw, 84px)/1 Bungee, Rubik, sans-serif;
    color: var(--cardboard);
    text-shadow: 0 5px 0 var(--cardboard-dark), 0 10px 24px rgba(0, 0, 0, .45);
  }
  .title span { color: var(--orange); }
  .slogan { margin: 14px 0 0; color: var(--cardboard); font-style: italic; font-size: 20px; opacity: .9; }
  .pitch { margin: 14px auto 0; max-width: 560px; color: var(--muted); }

  .card {
    background: var(--card); border: 1px solid var(--card-border);
    border-radius: var(--radius); padding: 24px; margin-bottom: 20px;
  }
  .card h2 { margin: 0 0 14px; font-size: 22px; font-weight: 700; }

  .release { text-align: center; padding: 32px 24px; border-color: rgba(242, 140, 40, .45); }
  .badge {
    display: inline-block; padding: 3px 12px; border-radius: 999px;
    font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
    color: var(--green); background: rgba(62, 207, 142, .12); border: 1px solid rgba(62, 207, 142, .35);
  }
  .badge.soon { color: var(--orange); background: rgba(242, 140, 40, .12); border-color: rgba(242, 140, 40, .4); }
  .version { margin: 14px 0 6px; font: 400 40px/1.1 Bungee, Rubik, sans-serif; }
  .meta { margin: 0 0 22px; color: var(--muted); font-size: 14px; }
  .btn {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 14px 34px; border-radius: 12px;
    background: var(--orange); color: #1d1206; text-decoration: none;
    font-weight: 700; font-size: 17px; letter-spacing: .08em; text-transform: uppercase;
    box-shadow: 0 5px 0 var(--cardboard-dark);
    transition: transform .12s ease, background .12s ease, box-shadow .12s ease;
  }
  .btn:hover { background: var(--orange-hover); transform: translateY(-2px); box-shadow: 0 7px 0 var(--cardboard-dark); }
  .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--cardboard-dark); }
  .btn[aria-disabled="true"] { background: #3a4460; color: #8792ad; box-shadow: none; pointer-events: none; }
  .btn svg { width: 20px; height: 20px; }
  .downloads { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 14px; }
  .btn small { font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: none; opacity: .75; }
  .btn.secondary {
    padding: 12px 24px; background: transparent; color: var(--cardboard);
    border: 2px solid rgba(242, 140, 40, .55); box-shadow: 0 5px 0 rgba(0, 0, 0, .35);
  }
  .btn.secondary:hover { background: rgba(242, 140, 40, .14); box-shadow: 0 7px 0 rgba(0, 0, 0, .35); }
  .btn.secondary:active { box-shadow: 0 2px 0 rgba(0, 0, 0, .35); }
  .btn.secondary[aria-disabled="true"] { border-color: transparent; }
  .hint { margin: 12px 0 0; color: var(--muted); font-size: 14px; }
  .rebind { margin: 16px 0 0; }
  .platform-links a { font-size: 14px; font-weight: 600; margin-right: 14px; }
  .hint code, .card code {
    background: var(--bg-deep); border: 1px solid var(--card-border); border-radius: 6px;
    padding: 1px 6px; font-size: .92em; color: var(--text);
  }
  .game-lang { margin-top: 6px; color: var(--cardboard); }

  .demo {
    margin: 0 0 20px; padding: 10px 14px; border-radius: 10px; text-align: center;
    background: rgba(43, 179, 163, .12); border: 1px dashed rgba(43, 179, 163, .6); color: #9fe5dc; font-size: 14px;
  }

  .shots { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
  .shots a { display: block; border-radius: 12px; overflow: hidden; border: 1px solid var(--card-border); }
  .shots a:first-child { grid-column: 1 / -1; }
  .shots img { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; object-fit: cover; transition: transform .25s ease; }
  .shots a:hover img { transform: scale(1.03); }

  .notes p { margin: 0 0 8px; }
  .notes p:first-child { font-weight: 600; }
  .notes ul { margin: 0 0 8px; padding-left: 20px; }
  .notes li { margin: 4px 0; }

  .steps { margin: 0 0 14px; padding: 0; list-style: none; counter-reset: step; }
  .steps li { position: relative; margin: 0 0 10px; padding-left: 40px; counter-increment: step; }
  .steps li::before {
    content: counter(step); position: absolute; left: 0; top: 0;
    width: 28px; height: 28px; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--orange); color: #1d1206; font-weight: 700; font-size: 14px;
  }
  .card p { margin: 0 0 10px; }
  .warn { color: var(--muted); font-size: 14px; }

  .controls { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px 20px; }
  .control { display: flex; align-items: center; gap: 12px; }
  kbd {
    flex: none; min-width: 44px; padding: 4px 10px; border-radius: 8px; text-align: center;
    background: var(--bg-deep); border: 1px solid var(--card-border); border-bottom-width: 3px;
    font: 600 13px/1.4 Rubik, sans-serif; color: var(--cardboard);
  }

  .release-item { padding: 16px 0; border-top: 1px solid var(--card-border); }
  .release-item:first-of-type { border-top: 0; padding-top: 0; }
  .release-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; margin-bottom: 8px; }
  .release-tag { font: 400 20px/1.2 Bungee, Rubik, sans-serif; color: var(--cardboard); }
  .release-date { color: var(--muted); font-size: 14px; }
  .release-item > a { font-size: 14px; font-weight: 600; }

  footer { text-align: center; color: var(--muted); font-size: 14px; margin-top: 32px; }

  [hidden] { display: none !important; }

  @media (max-width: 600px) {
    .wrap { padding-top: 72px; }
    .card { padding: 20px 16px; }
    .shots { grid-template-columns: 1fr; }
    .version { font-size: 32px; }
    .downloads { flex-direction: column; align-items: stretch; }
    .downloads .btn { justify-content: center; }
  }
  @media (prefers-reduced-motion: reduce) {
    .btn, .shots img { transition: none; }
  }
</style>

  const params = new URLSearchParams(location.search);

    const forced = params.get("os");

    const ua = `${(navigator.userAgentData && navigator.userAgentData.platform) || ""} ${navigator.platform || ""} ${navigator.userAgent || ""}`;
    if (/android|iphone|ipad/i.test(ua)) return "windows";
    if (/mac/i.test(ua)) return "macos";
    if (/linux|x11|cros/i.test(ua)) return "linux";
    return "windows";

      ctlCrouch: "しゃがむ（長押し）", ctlView: "視点切り替え",
      keySpace: "スペース", keyLeft: "左クリック", keyRight: "右クリック", keyRotate: "R + マウス",
      history: "バージョン履歴",
      downloadThis: "このバージョンをダウンロード",
      noNotes: "このバージョンにはメモがありません。",
      footer: "Godot 4 で制作",
      downloadFor: "{os} 版をダウンロード",
      hintWindows: "インストール不要：{file} を開くだけです。更新するときは新しいバージョンをダウンロードしてファイルを置き換えます。",
      hintLinux: "実行権限を付けて（chmod +x {file}）開いてください。",
      hintMac: "展開してアプリを開きます。初回は macOS にブロックされるので、システム設定 → プライバシーとセキュリティ → 「このまま開く」を選んでください。",
      friends1: "1人が <b>Crear partida</b>（ゲームを作成）、続けて <b>Crear</b> を押し、ファイアウォールでアクセスを許可します。",
      friends2: "その人の IP はポーズメニュー（<b>Esc</b>）に表示されます。<b>Copiar IP</b>（IPをコピー）でコピーして共有できます。",
      friends3: "ほかの人は <b>Unirse a una partida</b>（ゲームに参加）を押し、その IP を入力して <b>Unirse</b>（参加）を押します。",
      solo: "一緒に遊ぶ人がいない？ <b>Jugar solo</b>（ひとりで遊ぶ）なら力が2倍になり、Esc で本当にポーズできます。",
      ctlKick: "蹴る",
      ctlChat: "テキストチャット",
      ctlTalk: "話す（近接ボイスチャット）",
      ctlMenu: "メニュー / ポーズ",
      ctlFps: "FPS表示",
      rebind: "すべてのキーは「オプション」（Opciones）で変更できます。",
    },
    ko: {
      language: "언어",
      eyebrow: "물리 기반 협동 · 1–4인",
      pitch: "물리 기반 협동 이사 게임. 소파는 둘이서 들고, 꽃병은 깨지 말고, 모든 짐을 트럭에 실으세요.",
      latest: "최신 버전",
      released: "{date} 공개 · {size}",
      download: "다운로드",
      gameLang: "현재 게임은 스페인어로만 제공됩니다.",
      loading: "불러오는 중…",
      soonTitle: "곧 출시",
      soonText: "아직 공개된 버전이 없습니다. 곧 다시 확인해 주세요!",
      apiError: "버전 목록을 불러오지 못했습니다. 버튼으로는 최신 버전을 계속 다운로드할 수 있습니다.",
      whatsNew: "새로운 기능",
      friendsTitle: "친구와 함께 플레이",
      friendsRemote: "각자 다른 곳에서 플레이하나요? Radmin VPN이나 ZeroTier에서 받은 IP를 쓰거나, 호스트 공유기에서 UDP 7777 포트를 여세요.",
      friendsVersion: "모두 같은 버전이 필요합니다. 최대 4명까지 플레이할 수 있습니다.",
      smartscreen: "'Windows의 PC 보호' 경고가 나오면: 추가 정보 → 실행.",
      controls: "조작법",
      ctlMove: "이동", ctlRun: "달리기", ctlJump: "점프", ctlGrab: "잡기(누르고 있기)",
      ctlRotate: "들고 있는 물건 회전",
      ctlUse: "사용",
      ctlCrouch: "앉기(누르고 있기)", ctlView: "시점 전환",
      keySpace: "스페이스", keyLeft: "좌클릭", keyRight: "우클릭", keyRotate: "R + 마우스",
      history: "버전 기록",
      downloadThis: "이 버전 다운로드",
      noNotes: "이 버전에 대한 메모가 없습니다.",
      footer: "Godot 4로 제작",
      downloadFor: "{os}용 다운로드",
      hintWindows: "설치할 필요 없이 {file}을(를) 실행하세요. 업데이트하려면 새 버전을 받아 파일을 교체하세요.",
      hintLinux: "실행 권한을 준 뒤(chmod +x {file}) 실행하세요.",
      hintMac: "압축을 풀고 앱을 여세요. 처음에는 macOS가 차단하니 시스템 설정 → 개인정보 보호 및 보안 → 그래도 열기를 누르세요.",
      friends1: "한 명이 <b>Crear partida</b>(게임 만들기)를 누른 다음 <b>Crear</b>를 누르고, 방화벽에서 접근을 허용합니다.",
      friends2: "그 사람의 IP는 일시정지 메뉴(<b>Esc</b>)에 표시되며, <b>Copiar IP</b>(IP 복사)로 복사해 공유할 수 있습니다.",
      friends3: "다른 사람들은 <b>Unirse a una partida</b>(게임 참가)를 누르고 그 IP를 입력한 뒤 <b>Unirse</b>(참가)를 누릅니다.",
      solo: "같이 할 사람이 없나요? <b>Jugar solo</b>(혼자 하기)에서는 힘이 두 배가 되고 Esc로 게임이 실제로 일시정지됩니다.",
      ctlKick: "차기",
      ctlChat: "텍스트 채팅",
      ctlTalk: "말하기(근거리 음성 채팅)",
      ctlMenu: "메뉴 / 일시정지",
      ctlFps: "FPS 표시",
      rebind: "모든 키는 옵션(Opciones)에서 바꿀 수 있습니다.",
    },
  };

  const CONTROLS = [
    ["WASD", "ctlMove"], ["Shift", "ctlRun"], ["@keySpace", "ctlJump"],
    ["@keyLeft", "ctlGrab"], ["@keyRight", "ctlKick"], ["@keyRotate", "ctlRotate"],
    ["Ctrl", "ctlCrouch"], ["E", "ctlUse"], ["V", "ctlView"],
    ["T", "ctlChat"], ["B", "ctlTalk"], ["Esc", "ctlMenu"], ["F3", "ctlFps"],
  ];
  const SHOTS = [
    ["screenshots/pool.webp", "altPool"],
    ["screenshots/truck.webp", "altTruck"], ["screenshots/living-room.webp", "altLiving"],
    ["screenshots/carrying.webp", "altCarry"], ["screenshots/menu.webp", "altMenu"],
  ];

  // Versiones de ejemplo para la vista previa en local.
  const demoAssets = sizes => Object.values(PLATFORMS).map((p, i) => ({ name: p.file, size: sizes[i] * 1048576, browser_download_url: "#" }));
  const DEMO_RELEASES = [
    {
      tag_name: "v0.3.0", draft: false, published_at: "2026-09-26T00:00:00Z",
      assets: demoAssets([137, 103, 77]),
      body: "Chalet con piscina, personajes, sonido, chat y modo de un jugador.\n- Nuevo nivel: el chalet de los García, con dos plantas, escalera, balcón y piscina.",
    },
    {
      tag_name: "v0.2.0", draft: false, published_at: "2026-09-23T18:00:00Z",
      assets: demoAssets([104, 70, 58]),
      body: "Girar, patear y chocar entre jugadores.\n- R + ratón gira lo que llevas; lo pesado cuesta más.",
    },
    {
      tag_name: "v0.1.0", draft: false, published_at: "2026-09-23T12:00:00Z",
      assets: demoAssets([104, 70, 58]),
      body: "Primera versión jugable.\n- Mudanza cooperativa de hasta 4 jugadores con físicas.",
    },
  ];

  let lang = "en";
  let releases = null;       // null = cargando, [] = ninguna publicada
  let loadFailed = false;
  // Notas de cada versión traducidas y su fecha real (release-notes.json). Si falta
  // una versión o un idioma, se usa el inglés y, si no, lo que diga GitHub.
  let translatedNotes = {};

  const $ = id => document.getElementById(id);
  const t = (key, vars) => {
    let s = (I18N[lang] && I18N[lang][key]) ?? I18N.en[key] ?? key;
    for (const [k, v] of Object.entries(vars || {})) s = s.replaceAll(`{${k}}`, v);
    return s;
  };
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const fmtDate = iso => new Date(iso).toLocaleDateString(LOCALES[lang], { day: "numeric", month: "long", year: "numeric" });
  const fmtSize = bytes => bytes ? `${Math.round(bytes / 1048576).toLocaleString(LOCALES[lang])} MB` : "";

  function storage(key, value) {
    try {
      if (value === undefined) return localStorage.getItem(key);
      localStorage.setItem(key, value);
    } catch (e) { /* almacenamiento no disponible: no pasa nada */ }
    return null;
  }

  function detectLang() {
    const wanted = [params.get("lang"), storage("lang"), ...(navigator.languages || [navigator.language])];
    for (const code of wanted) {
      const base = (code || "").toLowerCase().split("-")[0];
      if (I18N[base]) return base;
    }
    return "en";
  }

  function renderNotes(text) {
    const lines = (text || "").split(/\r?\n/).map(l => l.trim()).filter(Boolean);
    if (!lines.length) return `<p>${esc(t("noNotes"))}</p>`;
    let html = "", inList = false;
    for (const line of lines) {
      const item = line.match(/^[-*•]\s+(.*)/);
      if (item && !inList) { html += "<ul>"; inList = true; }
      if (!item && inList) { html += "</ul>"; inList = false; }
      html += item ? `<li>${esc(item[1])}</li>` : `<p>${esc(line.replace(/^#+\s*/, ""))}</p>`;
    }
    return html + (inList ? "</ul>" : "");
  }

  const notesOf = release => {
    const notes = (translatedNotes[release.tag_name] || {}).notes || {};
    return notes[lang] || notes.en || release.body;
  };
  const dateOf = release => (translatedNotes[release.tag_name] || {}).date || release.published_at;

  const assetFor = (release, platform) => (release.assets || []).find(a => a.name === PLATFORMS[platform].file);
  const assetUrl = (release, platform) => {
    const asset = assetFor(release, platform);
    return asset && !DEMO ? asset.browser_download_url : "#";
  };

  function renderStatic() {
    const current = PLATFORMS[PLATFORM];
    document.documentElement.lang = lang;
    document.title = `Get a Move On! — ${t("download")}`;
    document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll("[data-i18n-html]").forEach(el => { el.innerHTML = t(el.dataset.i18nHtml); });
    $("hint").innerHTML = esc(t(current.hint)).replace("{file}", `<code>${esc(current.file)}</code>`);
    $("smartscreen").hidden = PLATFORM !== "windows";
    $("game-lang").hidden = lang === "es";
    $("demo").hidden = !DEMO;
    $("controls").innerHTML = CONTROLS.map(([key, action]) =>
      `<div class="control"><kbd>${esc(key.startsWith("@") ? t(key.slice(1)) : key)}</kbd><span>${esc(t(action))}</span></div>`
    ).join("");
    $("shots").innerHTML = SHOTS.map(([src, alt], i) =>
      `<a href="${src}" target="_blank" rel="noopener"><img src="${src}" alt="${esc(t(alt))}" width="1280" height="720" ${i ? 'loading="lazy"' : ""}></a>`
    ).join("");
  }

  // Un botón por sistema, siempre en el mismo orden; el de quien visita, destacado.
  // Sin lista de versiones (cargando o si falla la API) apuntan a la última igualmente.
  function renderDownloads(latest, disabled) {
    $("downloads").innerHTML = Object.keys(PLATFORMS).map(p => {
      const primary = p === PLATFORM;
      const asset = latest && assetFor(latest, p);
      const url = asset ? (DEMO ? "#" : asset.browser_download_url) : latestUrl(p);
      const label = primary ? t("downloadFor", { os: PLATFORMS[p].os }) : PLATFORMS[p].os;
      const size = asset ? `<small>${esc(fmtSize(asset.size))}</small>` : "";
      const link = disabled ? 'aria-disabled="true"' : `href="${esc(url)}"`;
      return `<a class="btn${primary ? "" : " secondary"}" ${link}>${DOWNLOAD_ICON}<span>${esc(label)}</span>${size}</a>`;
    }).join("");
  }

  function renderReleases() {
    const badge = $("badge");
    const hasRelease = releases && releases.length > 0;
    badge.classList.toggle("soon", releases !== null && !hasRelease && !loadFailed);
    renderDownloads(null, false);
    $("news-card").hidden = !hasRelease;
    $("history-card").hidden = !hasRelease;

    if (releases === null) {
      badge.textContent = t("latest");
      $("version").textContent = "—";
      $("meta").textContent = t(loadFailed ? "apiError" : "loading");
      return;
    }
    if (!hasRelease) {
      badge.textContent = t("soonTitle");
      $("version").textContent = "—";
      $("meta").textContent = t("soonText");
      renderDownloads(null, true);
      return;
    }

    const latest = releases[0];
    badge.textContent = t("latest");
    $("version").textContent = latest.tag_name;
    // El tamaño va en cada botón.
    $("meta").textContent = t("released", { date: fmtDate(dateOf(latest)), size: "" }).replace(/ · $/, "");
    renderDownloads(latest, false);
    $("news").innerHTML = renderNotes(notesOf(latest));
    // Todas las versiones jugables, cada una con su archivo para cada sistema.
    $("history").innerHTML = releases.map((release, i) => {
      const links = Object.keys(PLATFORMS).filter(p => assetFor(release, p))
        .map(p => `<a href="${esc(assetUrl(release, p))}">${esc(PLATFORMS[p].os)}</a>`).join(" · ");
      const block = i > 0 && links ? `<div class="platform-links">${esc(t("downloadThis"))}: ${links}</div>` : "";
      return `<div class="release-item">
        <div class="release-head"><span class="release-tag">${esc(release.tag_name)}</span>
        <span class="release-date">${esc(fmtDate(dateOf(release)))}</span></div>
        <div class="notes">${renderNotes(notesOf(release))}</div>${block}</div>`;
    }).join("");
  }

  function setLang(code) {
    lang = I18N[code] ? code : "en";
    $("lang-select").value = lang;
    renderStatic();
    renderReleases();
  }

  $("lang-select").innerHTML = Object.entries(LANGS)
    .map(([code, name]) => `<option value="${code}">${name}</option>`).join("");
  $("lang-select").addEventListener("change", e => {
    storage("lang", e.target.value);
    setLang(e.target.value);
  });
  setLang(detectLang());

  // Las notas traducidas llegan aparte; al llegar se vuelven a pintar las versiones.
  fetch("release-notes.json")
    .then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(data => { translatedNotes = data || {}; renderReleases(); })
    .catch(() => { /* sin traducciones: se ven las notas de GitHub */ });

  if (DEMO) {
    releases = DEMO_RELEASES;
    renderReleases();
  } else {
    fetch(`https://api.github.com/repos/${OWNER}/${REPO}/releases?per_page=30`)
      .then(r => r.ok ? r.json() : Promise.reject(r.status))
      .then(list => { releases = list.filter(r => !r.draft); renderReleases(); })
      .catch(() => { loadFailed = true; renderReleases(); });
  }
</script>
